<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TilbudTracker — This week's best prices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171A; --surface:#1B1F24; --surface-2:#232830; --raise:#2A3038;
    --paper:#EDEFE9; --ink:#ECEEF0; --muted:#8A9099; --muted-2:#5C636C;
    --led:#4AFF8C; --led-dim:#2E9E5C; --cyan:#5FD4E8; --alert:#FF6B5C;
    --line:#2E333A; --line-strong:#3A4048;
    --radius:12px; --radius-sm:8px;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; padding-bottom:calc(72px + var(--safe-bottom));
    min-height:100vh;
  }
  h1,h2,h3{font-family:var(--sans); margin:0;}
  button{font-family:var(--sans); cursor:pointer;}
  input,select{font-family:var(--sans);}
  .mono{font-family:var(--mono);}
  a{color:var(--cyan);}

  /* ---------- header ---------- */
  .app-header{padding:22px 16px 14px; text-align:center; border-bottom:1px dashed var(--line-strong); position:relative;}
  .app-header .lang-toggle{position:absolute; top:14px; right:14px; display:flex; border:1px solid var(--line-strong); border-radius:14px; overflow:hidden;}
  .app-header .lang-toggle button{background:var(--surface-2); border:none; color:var(--muted); font-family:var(--mono); font-size:10px; font-weight:700; padding:5px 9px;}
  .app-header .lang-toggle button.on{background:var(--led); color:#0B140D;}
  .app-header .lang-toggle button+button{border-left:1px solid var(--line-strong);}
  .app-header .wordmark{font-family:var(--mono); letter-spacing:.22em; text-transform:uppercase; font-size:11px; color:var(--muted-2);}
  .app-header h1{font-weight:700; font-size:21px; margin:.3rem 0 .15rem;}
  .app-header .meta{font-family:var(--mono); font-size:11px; color:var(--muted); display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:6px;}
  .dealer-chip{display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:20px; font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.02em;}
  .dealer-strip{display:flex; gap:6px; justify-content:center; margin-top:10px; flex-wrap:wrap;}

  .banner{margin:12px 16px 0; padding:10px 12px; border-radius:var(--radius-sm); font-size:12.5px; line-height:1.4; display:flex; gap:8px; align-items:flex-start;}
  .banner.demo{background:rgba(95,212,232,.1); border:1px solid rgba(95,212,232,.35); color:var(--cyan);}
  .banner.warn{background:rgba(255,107,92,.1); border:1px solid rgba(255,107,92,.35); color:var(--alert);}
  .banner button.dismiss{background:none;border:none;color:inherit;font-size:11px;text-decoration:underline;padding:0;margin-left:auto;flex-shrink:0;}

  main{max-width:640px; margin:0 auto; padding:0 12px;}
  .section-title{font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:20px 4px 10px;}
  .empty-state{padding:32px 16px; text-align:center; color:var(--muted); font-size:14px; line-height:1.5;}
  .empty-state button{margin-top:12px;}

  /* ---------- buttons ---------- */
  .btn{border-radius:var(--radius-sm); border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink); padding:9px 14px; font-size:13.5px; font-weight:600; transition:transform .08s ease;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--led); border-color:var(--led); color:#0B140D;}
  .btn.ghost{background:transparent; border-color:var(--line-strong); color:var(--muted);}
  .btn.danger{background:transparent; border-color:var(--alert); color:var(--alert);}
  .btn.small{padding:5px 10px; font-size:12px;}
  .btn.block{width:100%;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}

  /* ---------- offer card ---------- */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px; position:relative; animation:riseIn .25s ease both;}
  @keyframes riseIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion: reduce){ .card{animation:none;} }
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .card-name{font-size:15px; font-weight:600; line-height:1.3;}
  .card-sub{font-size:11.5px; color:var(--muted); font-family:var(--mono); margin-top:2px;}
  .stamp{font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:3px 7px; border-radius:5px; border:2px solid; transform:rotate(-5deg); white-space:nowrap; flex-shrink:0;}
  .stamp.excellent{color:var(--led); border-color:var(--led);}
  .stamp.good{color:var(--cyan); border-color:var(--cyan);}
  .stamp.normal{color:var(--muted); border-color:var(--muted-2);}
  .stamp.weak{color:var(--alert); border-color:var(--alert);}
  .stamp.unknown{color:var(--muted-2); border-color:var(--line-strong);}
  .stamp.due{color:var(--alert); border-color:var(--alert); transform:rotate(4deg);}

  .price-row{display:flex; align-items:baseline; gap:10px; margin-top:10px; flex-wrap:wrap;}
  .price-big{font-family:var(--mono); font-weight:700; font-size:26px; color:var(--led); letter-spacing:-.01em;}
  .price-pre{font-family:var(--mono); font-size:13px; color:var(--muted-2); text-decoration:line-through;}
  .unit-price{font-family:var(--mono); font-size:11.5px; color:var(--muted);}

  .card-actions{display:flex; gap:8px; margin-top:12px; align-items:center;}
  .card-actions .btn{flex:1;}
  .caret-btn{background:none; border:none; color:var(--muted); font-size:12px; padding:6px; flex:0 0 auto; font-family:var(--mono);}

  .alt-table{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line-strong); font-size:12.5px;}
  .alt-row{display:flex; justify-content:space-between; padding:4px 0; color:var(--muted);}
  .alt-row .dealer-chip{font-size:9px;}
  .alt-row .delta{font-family:var(--mono);}

  .sparkline{margin-top:8px; display:block;}

  /* ---------- tabs ---------- */
  .tabbar{position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--line-strong); display:flex; padding-bottom:var(--safe-bottom); z-index:50;}
  .tabbar button{flex:1; background:none; border:none; color:var(--muted); padding:10px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:600; letter-spacing:.02em;}
  .tabbar button.active{color:var(--led);}
  .tabbar svg{width:20px; height:20px;}

  /* ---------- misc components ---------- */
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .field input[type=text], .field input[type=number], .field select{
    width:100%; background:var(--surface-2); border:1px solid var(--line-strong); color:var(--ink);
    padding:10px 12px; border-radius:var(--radius-sm); font-size:14px;
  }
  .row{display:flex; gap:10px;}
  .row > *{flex:1;}
  .chip-toggle{display:inline-flex; align-items:center; padding:8px 12px; border-radius:20px; border:1px solid var(--line-strong); background:var(--surface-2); color:var(--muted); font-size:12.5px; margin:3px 4px 3px 0; user-select:none;}
  .chip-toggle.on{background:rgba(74,255,140,.12); border-color:var(--led); color:var(--led);}
  .cat-group{margin-bottom:16px;}
  .cat-group h4{font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted-2); margin:0 0 8px 2px;}

  .basket-dealer{margin-bottom:16px;}
  .basket-dealer-head{display:flex; justify-content:space-between; align-items:center; padding:8px 4px; border-bottom:1px solid var(--line-strong);}
  .basket-line{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px dashed var(--line);}
  .basket-line .name{flex:1; font-size:13.5px;}
  .basket-line .qty-ctl{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:13px;}
  .basket-line .qty-ctl button{width:22px; height:22px; border-radius:5px; border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink); font-size:13px; line-height:1;}
  .basket-line .line-total{font-family:var(--mono); font-weight:600; font-size:13.5px; min-width:64px; text-align:right;}
  .basket-line select.dealer-move{background:var(--surface-2); color:var(--muted); border:1px solid var(--line); border-radius:6px; font-size:10.5px; padding:2px 4px;}
  .totals-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin:14px 0;}
  .totals-row{display:flex; justify-content:space-between; padding:5px 0; font-size:13.5px;}
  .totals-row.grand{font-size:17px; font-weight:700; font-family:var(--mono); border-top:1px dashed var(--line-strong); margin-top:6px; padding-top:10px;}
  .totals-row .save{color:var(--led);}

  .suggest-box{background:rgba(95,212,232,.08); border:1px solid rgba(95,212,232,.3); border-radius:var(--radius-sm); padding:10px 12px; font-size:12.5px; color:var(--cyan); margin-bottom:12px; line-height:1.4;}

  .list-item{display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px dashed var(--line);}
  .list-item .grow{flex:1;}
  .list-item .name{font-size:13.5px; font-weight:600;}
  .list-item .sub{font-size:11.5px; color:var(--muted); font-family:var(--mono); margin-top:2px;}

  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
  .modal{background:var(--bg); width:100%; max-width:640px; max-height:88vh; overflow-y:auto; border-radius:16px 16px 0 0; padding:18px 16px calc(20px + var(--safe-bottom));}
  .modal h2{font-size:17px; margin-bottom:4px;}
  .modal .step-sub{font-size:12.5px; color:var(--muted); margin-bottom:14px;}

  .footer-actions{display:flex; gap:8px; margin:26px 0 10px; padding:0 4px;}
  .footer-note{text-align:center; font-size:11px; color:var(--muted-2); padding:6px 16px 20px; line-height:1.5;}

  .bar-chart{width:100%; height:140px;}
  .segmented{display:flex; border:1px solid var(--line-strong); border-radius:var(--radius-sm); overflow:hidden;}
  .segmented button{flex:1; background:var(--surface-2); border:none; color:var(--muted); padding:8px 4px; font-size:12px; font-weight:600;}
  .segmented button.on{background:var(--led); color:#0B140D;}
  .segmented button + button{border-left:1px solid var(--line-strong);}

  /* ---------- quick add / FAB ---------- */
  .fab{position:fixed; right:14px; bottom:calc(74px + var(--safe-bottom)); background:var(--led); color:#0B140D; border:none; border-radius:24px; padding:12px 16px; font-weight:700; font-size:12.5px; box-shadow:0 4px 16px rgba(0,0,0,.45); display:flex; align-items:center; gap:6px; z-index:60;}
  .fab svg{width:16px; height:16px;}
  .fab:active{transform:scale(.96);}
  .basket-line .src-tag{font-size:10px; color:var(--muted-2); font-family:var(--mono); margin-top:1px;}
  .basket-line .name-wrap{flex:1;}
  .price-unknown{color:var(--muted-2); font-style:italic;}
  .remove-x{background:none; border:none; color:var(--muted-2); font-size:15px; padding:2px 4px; flex-shrink:0;}
  .andet-note{font-size:11px; color:var(--muted); margin:-4px 0 8px 4px;}

  /* ---------- product thumbnails ---------- */
  .thumb{border-radius:8px; object-fit:cover; background:var(--surface-2); flex-shrink:0; display:block;}
  .thumb-placeholder{display:flex; align-items:center; justify-content:center; background:var(--surface-2); border-radius:8px; flex-shrink:0; color:var(--muted-2);}
  .thumb-placeholder svg{width:50%; height:50%;}
  .card-top-left{display:flex; gap:10px; align-items:flex-start;}

  /* ---------- section title row (used by Discover's refresh button) ---------- */
  .section-title-row{display:flex; align-items:center; justify-content:space-between; margin:20px 4px 10px;}
  .section-title-row .section-title{margin:0;}
  .icon-btn{background:var(--surface-2); border:1px solid var(--line-strong); border-radius:8px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; color:var(--muted); flex-shrink:0;}
  .icon-btn svg{width:16px; height:16px;}
  .icon-btn:active{transform:scale(.92);}
  .icon-btn.spin svg{animation:spin .5s ease;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .icon-btn.spin svg{animation:none;} }
</style>
</head>

function readEmbedded(id){

  catch(e){ return null; }

const EMBEDDED = {
  catalog: readEmbedded('embedded-catalog'),

};

let CATALOG_BASE = { products: [] };
let OFFERS = { week:'', dealers_failed:[], offers:[] };
let HISTORY = {};
let UNMATCHED = { candidates: [] };
let usingFallback = false;

async function loadData(){
  async function tryFetch(path){
    const res = await fetch(path, { cache:'no-store' });
    if(!res.ok) throw new Error('http '+res.status);
    return await res.json();
  }
  try{
    const [c,o,h,u] = await Promise.all([
      tryFetch('data/catalog.json'),
      tryFetch('data/offers.json'),
      tryFetch('data/price_history.json'),
      tryFetch('data/unmatched_candidates.json'),
    ]);
    CATALOG_BASE = c; OFFERS = o; HISTORY = h; UNMATCHED = u;
    usingFallback = false;
  }catch(e){
    CATALOG_BASE = EMBEDDED.catalog || { products: [] };
    OFFERS = EMBEDDED.offers || { week:'', dealers_failed:[], offers:[] };
    HISTORY = EMBEDDED.history || {};
    UNMATCHED = EMBEDDED.unmatched || { candidates: [] };
    usingFallback = true;
  }
}

/* =========================================================================
   UTILITIES
   ========================================================================= */
function fmtKr(n){
  if(n===null || n===undefined || isNaN(n)) return '–';
  return n.toLocaleString('da-DK',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' kr';
}
function fmtKrShort(n){
  if(n===null||n===undefined||isNaN(n)) return '–';
  return Math.round(n).toLocaleString('da-DK') + ' kr';
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysBetween(iso1, iso2){
  const a = new Date(iso1+'T00:00:00Z'), b = new Date(iso2+'T00:00:00Z');
  return Math.round((b-a)/86400000);
}
function uid(){ return 'x'+Math.random().toString(36).slice(2,10); }
function isoWeekOf(iso){
  const d = new Date(iso+'T00:00:00Z');
  const target = new Date(d.valueOf());
  const dayNr = (d.getUTCDay()+6)%7;
  target.setUTCDate(target.getUTCDate()-dayNr+3);
  const firstThursday = new Date(Date.UTC(target.getUTCFullYear(),0,4));
  const week = 1 + Math.round(((target-firstThursday)/86400000 - 3 + ((firstThursday.getUTCDay()+6)%7))/7);
  return `${target.getUTCFullYear()}-W${String(week).padStart(2,'0')}`;
}
function clamp(n,lo,hi){ return Math.max(lo,Math.min(hi,n)); }
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================================================
   CATALOG (shared dictionary + user's own custom products)
   ========================================================================= */
function mergedCatalog(){
  const custom = Object.entries(STATE.customProducts).map(([cid,p])=>({
    canonical_id: cid, display_name:p.displayName, category:p.category||'other',
    compare_basis:p.compareBasis||'kr/stk', default_cadence_days:p.cadenceDays||14,
    match_terms:p.matchTerms||[], exclude_terms:p.excludeTerms||[], custom:true,
  }));
  return [...(CATALOG_BASE.products||[]), ...custom];
}
let PRODUCT_INDEX = {};
function rebuildProductIndex(){
  PRODUCT_INDEX = {};
  for(const p of mergedCatalog()) PRODUCT_INDEX[p.canonical_id] = p;
}
function getProduct(cid){ return PRODUCT_INDEX[cid]; }

/* Client-side matching pass: only for offers the server pipeline left
   unmatched (canonical_id===null), tested against the user's own custom
   products. This lets someone track a personal product the shared
   catalog.json doesn't know about without waiting for a repo update. */
const DIACRITIC_MAP = {'æ':'ae','ø':'oe','å':'aa'};
function normalizeNameJS(raw){
  if(!raw) return '';
  let s = raw.toLowerCase().replace(/[æøå]/g, c=>DIACRITIC_MAP[c]);
  s = s.replace(/[^a-z0-9æøå%\s]/gi,' ').replace(/\s+/g,' ').trim();
  return s;
}
let LIVE_OFFERS = [];
function buildLiveOffers(){
  LIVE_OFFERS = (OFFERS.offers||[]).map(o=>({...o}));
  const customs = Object.entries(STATE.customProducts);
  if(!customs.length) return;
  for(const o of LIVE_OFFERS){
    if(o.canonical_id) continue;
    const norm = normalizeNameJS(o.name_raw);
    for(const [cid,p] of customs){
      const terms = (p.matchTerms||[]).map(normalizeNameJS).filter(Boolean);
      const excludes = (p.excludeTerms||[]).map(normalizeNameJS).filter(Boolean);
      if(excludes.some(ex=>norm.includes(ex))) continue;
      if(terms.some(t=>norm.includes(t))){ o.canonical_id = cid; break; }
    }
  }
}

/* =========================================================================
   DEAL QUALITY, DUE STATUS, DIGEST
   ========================================================================= */
function dealQuality(cid, unitPrice, hasActiveOfferEnd){
  const points = (HISTORY[cid]||[]).map(p=>p.unit_price).filter(x=>x!=null && !isNaN(x));
  if(points.length>=6 && unitPrice!=null){
    const sorted=[...points].sort((a,b)=>a-b);
    const percentile = sorted.filter(p=>p<=unitPrice).length/sorted.length;
    let label='normal';
    if(percentile<=0.10) label='excellent';
    else if(percentile<=0.35) label='good';
    else if(percentile<=0.65) label='normal';
    else label='weak';
    return {label, percentile};
  }
  // Cold start (not enough history yet): Prej doesn't supply a "was" price
  // to fall back on (a good thing — retailer-supplied "was" prices can be
  // inflated), so the only signal available this early is whether the
  // price carries an offer end date at all.
  if(hasActiveOfferEnd) return {label:'good', percentile:null};
  return {label:'unknown', percentile:null};
}
function historicalMedianPrice(cid){
  const points = (HISTORY[cid]||[]).map(p=>p.price).filter(x=>x!=null && !isNaN(x));
  if(points.length<4) return null;
  const sorted=[...points].sort((a,b)=>a-b);
  return sorted[Math.floor(sorted.length/2)];
}
function effectiveCadence(cid){
  const fav = STATE.favorites[cid];
  const base = fav ? fav.cadenceDays : 14;
  const purchases = STATE.purchases.filter(p=>p.cid===cid).sort((a,b)=>a.date<b.date?1:-1).slice(0,6);
  if(purchases.length<2) return base;
  const dates=purchases.map(p=>p.date).sort();
  const intervals=[];
  for(let i=1;i<dates.length;i++) intervals.push(daysBetween(dates[i-1],dates[i]));
  intervals.sort((a,b)=>a-b);
  const median = intervals[Math.floor(intervals.length/2)];
  return clamp(median,4,60);
}
function dueInfo(cid){
  const fav = STATE.favorites[cid];
  if(!fav) return null;
  const cadence = effectiveCadence(cid);
  const purchases = STATE.purchases.filter(p=>p.cid===cid).sort((a,b)=>a.date<b.date?1:-1);
  if(!purchases.length) return {due:true, daysSince:null, cadence, lastDate:null};
  const lastDate = purchases[0].date;
  const daysSince = daysBetween(lastDate, todayISO());
  return {due: daysSince >= 0.8*cadence, daysSince, cadence, lastDate};
}
function offersForCid(cid){
  return LIVE_OFFERS.filter(o=>o.canonical_id===cid && !STATE.excludedThisWeek.includes(cid))
    .sort((a,b)=>(a.unit_price??a.price)-(b.unit_price??b.price));
}
function buildDigest(){
  rebuildProductIndex();
  buildLiveOffers();
  const items=[];
  for(const cid of Object.keys(STATE.favorites)){
    const product = getProduct(cid);
    if(!product) continue;
    const offers = offersForCid(cid);
    const due = dueInfo(cid);
    let best=null, alternatives=[], quality={label:'unknown'}, savings=null;
    if(offers.length){
      best = offers[0];
      alternatives = offers.slice(1);
      const hasOfferEnd = (best.flags||[]).some(f=>f.startsWith('offer_ends:'));
      quality = dealQuality(cid, best.unit_price, hasOfferEnd);
      const median = historicalMedianPrice(cid);
      if(median!=null && median > best.price) savings = median - best.price;
    }
    items.push({cid, product, due, best, alternatives, quality, savings});
  }
  items.sort((a,b)=>{
    if((a.due?.due?1:0) !== (b.due?.due?1:0)) return (b.due?.due?1:0)-(a.due?.due?1:0);
    const qd = QUALITY_RANK[b.quality.label]-QUALITY_RANK[a.quality.label];
    if(qd) return qd;
    return (b.savings||0)-(a.savings||0);
  });
  return items;
}

/* ---- Discover feed: proof-of-life sample of live prices, weighted toward
   purchase history once it exists, random (but stable per day) before that.
   Deliberately excludes anything already favorited, since those already
   show up in the main digest above. ---- */
function seededRandom(seedStr){
  let h = 0;
  for(let i=0;i<seedStr.length;i++){ h = (Math.imul(31,h) + seedStr.charCodeAt(i)) | 0; }
  return function(){
    h = Math.imul(h ^ (h>>>15), h | 1);
    h ^= h + Math.imul(h ^ (h>>>7), h | 61);
    return ((h ^ (h>>>14))>>>0) / 4294967296;
  };
}
function shuffleSeeded(arr, seedStr){
  const rng = seededRandom(seedStr);
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
let DISCOVERY_REFRESH_COUNT = 0;   // bumped by the refresh button; not persisted, resets on reload
let DISCOVERY_JUST_REFRESHED = false; // one-shot flag consumed by renderWeekTab to trigger the spin
function sampleDiscoveryItems(n){
  const favCids = new Set(Object.keys(STATE.favorites));
  const candidateCids = [...new Set(
    LIVE_OFFERS.map(o=>o.canonical_id).filter(cid => cid && !favCids.has(cid) && getProduct(cid))
  )];
  if(!candidateCids.length) return {cids:[], usedHistory:false};

  const freq = {};
  for(const p of STATE.purchases){ if(p.cid) freq[p.cid] = (freq[p.cid]||0)+1; }
  const withFreq = candidateCids.filter(cid=>freq[cid]);

  let picked = withFreq.length ? [...withFreq].sort((a,b)=>freq[b]-freq[a]).slice(0, n) : [];
  const usedHistory = picked.length > 0;
  if(picked.length < n){
    const remaining = candidateCids.filter(cid=>!picked.includes(cid));
    // Seeded by today's date so a plain reload doesn't reshuffle mid-day, PLUS a
    // refresh counter the "show different picks" button bumps for an on-demand reroll.
    const seed = todayISO() + ':' + DISCOVERY_REFRESH_COUNT;
    picked = picked.concat(shuffleSeeded(remaining, seed).slice(0, n-picked.length));
  }
  return {cids:picked, usedHistory};
}

/* =========================================================================
   BASKET
   ========================================================================= */
function inBasket(item){
  if(STATE.excludedThisWeek.includes(item.cid)) return false;
  if(STATE.pinned.includes(item.cid)) return true;
  return !!(item.due && item.due.due);
}
function basketLineFor(item){
  const dealerKey = STATE.basketOverrides[item.cid] || (item.best ? item.best.dealer : null) || 'andet';
  const offer = item.best && item.best.dealer===dealerKey ? item.best
    : (item.alternatives.find(o=>o.dealer===dealerKey) || item.best || null);
  const qty = STATE.basketQty[item.cid] || (getProduct(item.cid)?.typical_qty) || 1;
  return { dealerKey, offer, qty };
}
function basketLineSourceTag(item){
  if(STATE.pinned.includes(item.cid)) return t('srcTagAddedNow');
  if(item.due && item.due.due) return item.due.lastDate ? t('srcTagRecurring') : t('srcTagFirstTime');
  return '';
}
function buildBasket(digest){
  const basketItems = digest.filter(inBasket);
  const byDealer = {};
  let grandTotal=0, totalSavings=0;
  for(const item of basketItems){
    const {dealerKey, offer, qty} = basketLineFor(item);
    const price = offer ? offer.price : null;
    const prePrice = offer ? offer.pre_price : null;
    const lineTotal = price!=null ? price*qty : 0;
    grandTotal += lineTotal;
    if(prePrice!=null && price!=null && prePrice>price) totalSavings += (prePrice-price)*qty;
    (byDealer[dealerKey] = byDealer[dealerKey]||[]).push({
      kind:'catalog', item, offer, qty, lineTotal, priceKnown: price!=null, sourceTag: basketLineSourceTag(item),
    });
  }
  for(const [id, ah] of Object.entries(STATE.adHocItems)){
    const dealerKey = ah.dealer || 'andet';
    const price = ah.price!=null ? Number(ah.price) : null;
    const qty = ah.qty || 1;
    const lineTotal = price!=null ? price*qty : 0;
    grandTotal += lineTotal;
    (byDealer[dealerKey] = byDealer[dealerKey]||[]).push({
      kind:'adhoc', adHocId:id, adHoc:ah, qty, lineTotal, priceKnown: price!=null, sourceTag:t('srcTagOneOff'),
    });
  }
  const subtotals = Object.fromEntries(Object.entries(byDealer).map(([k,lines])=>[k, lines.reduce((s,l)=>s+l.lineTotal,0)]));
  return {basketItems, byDealer, subtotals, grandTotal, totalSavings};
}
function consolidationSuggestion(basket){
  const dealerKeys = Object.keys(basket.subtotals).filter(k=>k!=='andet');
  for(const dk of dealerKeys){
    const sub = basket.subtotals[dk];
    if(sub<=0 || sub>=CONSOLIDATE_BELOW_KR) continue;
    const lines = basket.byDealer[dk].filter(l=>l.kind==='catalog');
    if(!lines.length) continue;
    let extra=0, feasible=true;
    for(const line of lines){
      const alt = [line.item.best, ...line.item.alternatives].find(o=>o && o.dealer!==dk && dealerKeys.includes(o.dealer));
      if(!alt){ feasible=false; break; }
      extra += (alt.price-line.offer.price)*line.qty;
    }
    if(feasible && extra <= CONSOLIDATE_EXTRA_MAX_KR){
      return { fromDealer:dk, extraKr: Math.max(0,extra), subtotal:sub };
    }
  }
  return null;
}

/* =========================================================================
   BUDGET PRIORITIZER
   ========================================================================= */
function applyBudget(digest, budget){
  const withOffer = digest.filter(i=>i.best);
  const needs = withOffer.filter(i=>i.due && i.due.due);
  const wants = withOffer.filter(i=>!(i.due && i.due.due) && ['excellent','good'].includes(i.quality.label));
  const qty = i => STATE.basketQty[i.cid] || (getProduct(i.cid)?.typical_qty) || 1;
  const needsCost = needs.reduce((s,i)=>s+i.best.price*qty(i),0);
  if(budget==null) return {needs, wants:[], needsCost, overBudget:false, remaining:null, suggestedExtras:[]};
  if(needsCost>budget){
    const over = [...needs].sort((a,b)=>b.best.price-a.best.price);
    return {needs:over, wants:[], needsCost, overBudget:true, remaining:budget-needsCost, suggestedExtras:[]};
  }
  let remaining = budget-needsCost;
  const ranked = [...wants].sort((a,b)=>{
    const pa = QUALITY_RANK[a.quality.label]*((a.savings||1)/Math.max(a.best.price,1));
    const pb = QUALITY_RANK[b.quality.label]*((b.savings||1)/Math.max(b.best.price,1));
    return pb-pa;
  });
  const suggestedExtras=[];
  for(const item of ranked){
    const cost = item.best.price*qty(item);
    if(cost<=remaining){ suggestedExtras.push(item); remaining-=cost; }
  }
  return {needs, wants, needsCost, overBudget:false, remaining, suggestedExtras};
}

/* =========================================================================
   PURCHASE LOGGING
   ========================================================================= */
function logPurchase(cid, dealer, price, prePrice, qty){
  STATE.purchases.push({id:uid(), cid, date:todayISO(), dealer, price, prePrice:prePrice||null, qty:qty||1});
  saveState();
}
function markWeekDone(basket){
  for(const [dealerKey, lines] of Object.entries(basket.byDealer)){
    for(const line of lines){
      if(line.kind==='adhoc'){
        STATE.purchases.push({id:uid(), cid:null, name:line.adHoc.name, date:todayISO(), dealer:dealerKey, price:line.adHoc.price, prePrice:null, qty:line.qty});
        delete STATE.adHocItems[line.adHocId];
      } else {
        logPurchase(line.item.cid, dealerKey, line.offer?line.offer.price:null, line.offer?line.offer.pre_price:null, line.qty);
        delete STATE.basketOverrides[line.item.cid];
        delete STATE.basketQty[line.item.cid];
        STATE.pinned = STATE.pinned.filter(c=>c!==line.item.cid);
      }
    }
  }
  saveState();
}

/* =========================================================================
   SPARKLINE / CHARTS (hand-rolled SVG, no chart library dependency)
   ========================================================================= */
function sparklineSVG(cid){
  const points = (HISTORY[cid]||[]).slice().sort((a,b)=>a.date<b.date?-1:1).slice(-14).map(p=>p.unit_price).filter(x=>x!=null);
  if(points.length<2) return '';
  const w=110,h=28,pad=3;
  const min=Math.min(...points), max=Math.max(...points);
  const span = (max-min)||1;
  const stepX = (w-2*pad)/(points.length-1);
  const coords = points.map((v,i)=>{
    const x = pad+i*stepX;
    const y = h-pad-((v-min)/span)*(h-2*pad);
    return [x,y];
  });
  const path = coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const last = coords[coords.length-1];
  return `<svg class="sparkline" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <path d="${path}" fill="none" stroke="#4AFF8C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.2" fill="#4AFF8C"/>
  </svg>`;
}
function weeklySpendChart(){
  const byWeekDealer = {};
  for(const p of STATE.purchases){
    if(p.price==null) continue;
    const wk = isoWeekOf(p.date);
    byWeekDealer[wk] = byWeekDealer[wk] || {};
    byWeekDealer[wk][p.dealer] = (byWeekDealer[wk][p.dealer]||0) + p.price*(p.qty||1);
  }
  const weeks = Object.keys(byWeekDealer).sort().slice(-8);
  if(!weeks.length) return `<div class="empty-state">${t('noPurchasesYet')}</div>`;
  const maxTotal = Math.max(...weeks.map(wk=>Object.values(byWeekDealer[wk]).reduce((s,v)=>s+v,0)), 1);
  const w=560,h=140,barW=Math.min(48,(w/weeks.length)-10);
  let bars='';
  weeks.forEach((wk,i)=>{
    const x = 10 + i*(w-20)/weeks.length;
    let yOff=h-20;
    for(const dk of Object.keys(byWeekDealer[wk])){
      const val = byWeekDealer[wk][dk]||0;
      if(!val) continue;
      const d = dealerDisplay(dk);
      const barH = (val/maxTotal)*(h-40);
      yOff -= barH;
      bars += `<rect x="${x}" y="${yOff}" width="${barW}" height="${barH}" fill="${d.color}" rx="2"/>`;
    }
    bars += `<text x="${x+barW/2}" y="${h-6}" font-size="9" fill="#8A9099" text-anchor="middle" font-family="IBM Plex Mono,monospace">${wk.slice(6)}</text>`;
  });
  return `<svg class="bar-chart" viewBox="0 0 ${w} ${h}">${bars}</svg>`;
}

/* Product thumbnail with graceful fallback. Renders the img and a hidden
   placeholder as siblings; if the image 404s, JS swaps visibility rather
   than leaving a broken-image icon or blank gap — useful for confirming
   "is this actually the product I think it is" at a glance, especially
   once real Prej image_url data is flowing (demo data has none, so the
   placeholder is what you'll see until a real API key is connected). */
function thumbHtml(url, sizePx){
  const placeholderSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${ICONS.basket}</svg>`;
  const placeholder = `<div class="thumb-placeholder" style="width:${sizePx}px;height:${sizePx}px;${url?'display:none;':''}">${placeholderSvg}</div>`;
  if(!url) return placeholder;
  const img = `<img class="thumb" src="${escapeHtml(url)}" width="${sizePx}" height="${sizePx}" alt="" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">`;
  return img + placeholder;
}
function imageForCid(cid){
  const offer = LIVE_OFFERS.find(o=>o.canonical_id===cid && o.image);
  return offer ? offer.image : null;
}

function renderWeekTab(digest){
  const hasFavorites = Object.keys(STATE.favorites).length > 0;

    html += `<div class="empty-state">${t('emptyWeekNoFavorites')}<br><button class="btn primary" data-action="open-onboarding">${t('chooseProductsBtn')}</button></div>`;
  } else {
    const withOffer = digest.filter(i=>i.best);
    const dueNoOffer = digest.filter(i=>!i.best && i.due && i.due.due);
    const budget = STATE.budgetWeeklyDkk;

    html += `
    <div class="field" style="margin-top:14px;">

    if(budget!=null){

        html += `<div class="banner warn">${t('overBudgetMsg', {cost: fmtKrShort(b.needsCost), over: fmtKrShort(Math.abs(b.remaining))})}</div>`;
      } else {
        const extras = b.suggestedExtras.length ? t('extrasSuffix', {n: b.suggestedExtras.length}) : '';

        </div>`;
      }
    }

    html += `<div class="section-title">${t('thisWeeksOffers', {n: withOffer.length})}</div>`;
    html += withOffer.length ? withOffer.map(i=>offerCardHtml(i, b.suggestedExtras.includes(i))).join('') : `<div class="empty-state">${t('noOffersThisWeek')}</div>`;

    if(dueNoOffer.length){
      html += `<div class="section-title">${t('missingFromCatalogs')}</div>`;
      html += dueNoOffer.map(i=>notOnOfferCardHtml(i)).join('');
    }
  }

  if(discovery.cids.length){
    const justRefreshed = DISCOVERY_JUST_REFRESHED;
    DISCOVERY_JUST_REFRESHED = false; // consume the one-shot flag so unrelated re-renders don't replay the spin
    html += `<div class="section-title-row">

  const best = offers[0];
  const alternatives = offers.slice(1);
  const dealer = DEALER_BY_KEY[best.dealer];
  const hasOfferEnd = (best.flags||[]).some(f=>f.startsWith('offer_ends:'));
  const quality = dealQuality(cid, best.unit_price, hasOfferEnd);
  return `

    <div class="card-top">

          <option value="pantry">${t('cat_pantry')}</option><option value="produce">${t('cat_produce')}</option>
          <option value="dairy">${t('cat_dairy')}</option><option value="meat">${t('cat_meat')}</option>
          <option value="household">${t('cat_household')}</option><option value="other">${t('cat_other')}</option>
        </select>
      </div>
      <div class="field"><label>${t('unitLabel')}</label>
        <select id="custom-basis"><option value="kr/kg">kr/kg</option><option value="kr/l">kr/l</option><option value="kr/stk">kr/stk</option></select>
      </div>
    </div>
    <div class="field"><label>${t('searchTermsLabel')}</label><input type="text" id="custom-terms" placeholder="${t('searchTermsPlaceholder')}"></div>
    <button class="btn primary block" data-action="add-custom">${t('addAndFollowBtn')}</button>
  </div>`;

  return html;
}

/* ---- History tab ---- */
function renderHistoryTab(){
  const totalSaved = STATE.purchases.reduce((s,p)=> s + (p.prePrice&&p.prePrice>p.price ? (p.prePrice-p.price)*(p.qty||1) : 0), 0);
  const recent = [...STATE.purchases].sort((a,b)=>a.date<b.date?1:-1).slice(0,25);
  let html = `<div class="section-title">${t('weeklySpendTitle')}</div>${weeklySpendChart()}`;
  html += `<div class="totals-card"><div class="totals-row grand"><span>${t('totalSaved')}</span><span class="save">${fmtKr(totalSaved)}</span></div></div>`;
  html += `<div class="section-title">${t('recentPurchases', {n: STATE.purchases.length})}</div>`;
  html += recent.length ? recent.map(p=>{
    const product = p.cid ? getProduct(p.cid) : null;
    const d = dealerDisplay(p.dealer);
    const label = product ? product.display_name : (p.name || p.cid || '—');
    const priceLabel = p.price!=null ? fmtKrShort(p.price*(p.qty||1)) : t('priceUnknown');
    return `<div class="list-item">
      <div class="grow">
        <div class="name">${escapeHtml(label)}</div>
        <div class="sub">${p.date} · ${d.name} · ${priceLabel}</div>
      </div>
      <button class="btn danger small" data-action="delete-purchase" data-id="${p.id}">${t('deleteBtn')}</button>
    </div>`;
  }).join('') : `<div class="empty-state">${t('noPurchasesYet')}</div>`;
  return html;
}

/* ---- Onboarding modal ---- */
let ONBOARD_STEP = 1;
let ONBOARD_SELECTED = new Set();
let ONBOARD_CADENCE = {};
function renderOnboardingModal(){
  if(ONBOARD_STEP===1){
    const already = new Set(Object.keys(STATE.favorites));
    const cats = {};
    for(const p of mergedCatalog()){
      if(already.has(p.canonical_id)) continue;
      (cats[p.category]=cats[p.category]||[]).push(p);
    }
    return `<div class="modal-overlay"><div class="modal">
      <h2>${t('onboardingTitle1')}</h2>
      <div class="step-sub">${t('onboardingSub1')}</div>
      ${Object.entries(cats).map(([cat,items])=>`
        <div class="cat-group">
          <h4>${t('cat_'+cat) !== 'cat_'+cat ? t('cat_'+cat) : cat}</h4>
          ${items.map(p=>`<span class="chip-toggle ${ONBOARD_SELECTED.has(p.canonical_id)?'on':''}" data-action="toggle-onboard" data-cid="${p.canonical_id}">${escapeHtml(p.display_name)}</span>`).join('')}
        </div>`).join('')}
      <div class="footer-actions">
        <button class="btn ghost" data-action="skip-onboarding">${t('skipBtn')}</button>
        <button class="btn primary block" data-action="onboard-next" ${ONBOARD_SELECTED.size?'':'disabled'}>${t('continueBtn', {n: ONBOARD_SELECTED.size})}</button>
      </div>
    </div></div>`;
  }
  // step 2: cadence
  const list = [...ONBOARD_SELECTED];
  return `<div class="modal-overlay"><div class="modal">
    <h2>${t('onboardingTitle2')}</h2>
    <div class="step-sub">${t('onboardingSub2')}</div>
    ${list.map(cid=>{
      const p = getProduct(cid);
      const cur = ONBOARD_CADENCE[cid] || p.default_cadence_days || 14;
      return `<div class="list-item">
        <div class="grow"><div class="name">${escapeHtml(p.display_name)}</div></div>
        <div class="segmented" style="width:180px;">
          ${cadencePresets().map(c=>`<button class="${cur===c.days?'on':''}" data-action="set-cadence" data-cid="${cid}" data-days="${c.days}">${c.label}</button>`).join('')}
        </div>
      </div>`;
    }).join('')}
    <div class="footer-actions">
      <button class="btn ghost" data-action="onboard-back">${t('backBtn')}</button>
      <button class="btn primary block" data-action="finish-onboarding">${t('saveAndStartBtn')}</button>
    </div>
  </div></div>`;
}

/* ---- Quick add ("we're just out of it") modal ---- */
let QUICKADD_OPEN = false;
let QUICKADD_QUERY = '';
function renderQuickAddModal(){
  return `<div class="modal-overlay">
    <div class="modal">
      <h2>${t('quickAddTitle')}</h2>
      <div class="step-sub">${t('quickAddSub')}</div>
      <div class="field"><input type="text" id="quickadd-input" placeholder="${t('quickAddPlaceholder')}" value="${escapeHtml(QUICKADD_QUERY)}" autocomplete="off"></div>
      <div id="quickadd-results">${renderQuickAddResultsHtml(QUICKADD_QUERY)}</div>
      <div class="footer-actions"><button class="btn ghost block" data-action="close-quickadd">${t('closeBtn')}</button></div>
    </div>
  </div>`;
}
function renderQuickAddResultsHtml(query){
  const norm = normalizeNameJS(query);
  const digest = buildDigest();
  const inBasketCids = new Set(digest.filter(inBasket).map(i=>i.cid));
  let html = '';
  if(norm){
    const matches = mergedCatalog().filter(p=>normalizeNameJS(p.display_name).includes(norm)).slice(0,12);
    html += matches.map(p=>{
      const isFav = !!STATE.favorites[p.canonical_id];
      const already = inBasketCids.has(p.canonical_id);
      const tag = already ? t('alreadyInBasket') : (isFav ? t('trackedNotDue') : t('newItemNote'));
      return `<div class="list-item" data-action="quickadd-select" data-cid="${p.canonical_id}">
        ${thumbHtml(imageForCid(p.canonical_id), 40)}
        <div class="grow"><div class="name">${escapeHtml(p.display_name)}</div><div class="sub">${tag}</div></div>
        <button class="btn primary small">${already?'✓':t('addBtn')}</button>
      </div>`;
    }).join('');
  }
  if(query.trim()){
    html += `<div class="list-item" data-action="quickadd-adhoc" data-name="${escapeHtml(query.trim())}">
      <div class="grow"><div class="name">"${escapeHtml(query.trim())}"</div><div class="sub">${t('notInCatalogAdhoc')}</div></div>
      <button class="btn ghost small">${t('oneOffBtn')}</button>
    </div>`;
  }
  if(!html) html = `<div class="empty-state">${t('startTypingNote')}</div>`;
  return html;
}

/* =========================================================================
   EVENT HANDLING (delegated)
   ========================================================================= */
let DELEGATED_LISTENERS_BOUND = false;
function bindDelegatedListenersOnce(){
  if(DELEGATED_LISTENERS_BOUND) return;
  const app = document.getElementById('app');
  app.addEventListener('click', onClick);
  app.addEventListener('change', onChange);
  DELEGATED_LISTENERS_BOUND = true;
}
function bindPerRenderInputs(){
  const budgetInput = document.getElementById('budget-input');
  if(budgetInput){
    budgetInput.addEventListener('change', e=>{
      const v = e.target.value.trim();
      STATE.budgetWeeklyDkk = v? Number(v) : null;
      saveState(); render();
    });
  }
  const quickInput = document.getElementById('quickadd-input');
  if(quickInput){
    try{
      quickInput.focus();
      quickInput.selectionStart = quickInput.selectionEnd = quickInput.value.length;
    }catch(e){ /* not all environments support focus/selection APIs */ }
    quickInput.addEventListener('input', e=>{
      QUICKADD_QUERY = e.target.value;
      const results = document.getElementById('quickadd-results');
      if(results) results.innerHTML = renderQuickAddResultsHtml(QUICKADD_QUERY);
    });
  }
}

function onClick(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const cid = el.dataset.cid;

  switch(action){
    case 'tab': ACTIVE_TAB = el.dataset.tab; render(); break;
    case 'dismiss-demo': STATE.demoDismissed = true; saveState(); render(); break;

    case 'toggle-basket': {
      if(STATE.pinned.includes(cid)){ STATE.pinned = STATE.pinned.filter(c=>c!==cid); }
      else if(STATE.excludedThisWeek.includes(cid)){ STATE.excludedThisWeek = STATE.excludedThisWeek.filter(c=>c!==cid); STATE.pinned.push(cid); }
      else {
        const digest = buildDigest();
        const item = digest.find(i=>i.cid===cid);
        const currentlyIn = item && inBasket(item);
        if(currentlyIn) STATE.excludedThisWeek.push(cid); else STATE.pinned.push(cid);
      }
      saveState(); render(); break;
    }
    case 'toggle-alts': {
      const box = document.getElementById('alts-'+cid);
      if(box) box.style.display = box.style.display==='none' ? 'block' : 'none';
      break;
    }
    case 'log-purchase':
      logPurchase(cid, el.dataset.dealer, Number(el.dataset.price), el.dataset.preprice?Number(el.dataset.preprice):null, STATE.basketQty[cid]||1);
      render(); break;
    case 'log-purchase-manual':
      logPurchase(cid, 'other', null, null, 1);
      render(); break;
    case 'snooze': {
      const fav = STATE.favorites[cid];
      if(fav) logPurchase(cid, 'skipped', null, null, 0); // resets "due" clock without claiming a price
      render(); break;
    }

    case 'qty-inc': STATE.basketQty[cid] = (STATE.basketQty[cid]|| (getProduct(cid)?.typical_qty)||1)+1; saveState(); render(); break;
    case 'qty-dec': {
      const cur = STATE.basketQty[cid] || (getProduct(cid)?.typical_qty) || 1;
      STATE.basketQty[cid] = Math.max(1,cur-1); saveState(); render(); break;
    }
    case 'mark-week-done': {
      const digest = buildDigest();
      const basket = buildBasket(digest);
      markWeekDone(basket);
      render(); break;
    }

    case 'edit-cadence': {
      const fav = STATE.favorites[cid];
      const next = cadencePresets().find(c=>c.days>fav.cadenceDays) || cadencePresets()[0];
      fav.cadenceDays = next.days; saveState(); render(); break;
    }
    case 'remove-favorite': delete STATE.favorites[cid]; saveState(); render(); break;
    case 'accept-candidate':
      STATE.favorites[cid] = STATE.favorites[cid] || {cadenceDays:(getProduct(cid)?.default_cadence_days)||14, typicalQty:1, addedAt:todayISO()};
      saveState(); render(); break;
    case 'dismiss-candidate': STATE.dismissedCandidates.push(el.dataset.offer); saveState(); render(); break;
    case 'add-custom': addCustomProduct(); break;

    case 'delete-purchase': STATE.purchases = STATE.purchases.filter(p=>p.id!==el.dataset.id); saveState(); render(); break;

    case 'open-onboarding': ONBOARD_STEP=1; ONBOARD_SELECTED=new Set(); ONBOARD_CADENCE={}; STATE.onboarded=false; render(); break;
    case 'skip-onboarding': STATE.onboarded=true; saveState(); render(); break;
    case 'toggle-onboard':
      ONBOARD_SELECTED.has(cid) ? ONBOARD_SELECTED.delete(cid) : ONBOARD_SELECTED.add(cid);
      render(); break;
    case 'onboard-next': ONBOARD_STEP=2; render(); break;
    case 'onboard-back': ONBOARD_STEP=1; render(); break;
    case 'set-cadence': ONBOARD_CADENCE[cid]=Number(el.dataset.days); render(); break;
    case 'finish-onboarding': {
      for(const c of ONBOARD_SELECTED){
        const p = getProduct(c);
        STATE.favorites[c] = { cadenceDays: ONBOARD_CADENCE[c]||p.default_cadence_days||14, typicalQty:1, addedAt: todayISO() };
      }
      STATE.onboarded = true; saveState(); render(); break;
    }
    case 'export-data': exportData(); break;
    case 'import-data': document.getElementById('import-file').click(); break;

    case 'open-quickadd': QUICKADD_OPEN=true; QUICKADD_QUERY=''; render(); break;
    case 'close-quickadd': QUICKADD_OPEN=false; render(); break;
    case 'quickadd-select': {
      if(!STATE.favorites[cid]){
        const p = getProduct(cid);
        STATE.favorites[cid] = { cadenceDays: (p&&p.default_cadence_days)||21, typicalQty:1, addedAt: todayISO() };
      }
      if(!STATE.pinned.includes(cid)) STATE.pinned.push(cid);
      STATE.excludedThisWeek = STATE.excludedThisWeek.filter(c=>c!==cid);
      saveState(); render(); break;
    }
    case 'quickadd-adhoc': {
      const name = el.dataset.name;
      if(name){
        STATE.adHocItems[uid()] = { name, dealer:null, price:null, qty:1, note:'', addedAt: todayISO() };
        saveState();
      }
      QUICKADD_QUERY = '';
      render(); break;
    }
    case 'delete-adhoc': delete STATE.adHocItems[el.dataset.id]; saveState(); render(); break;
    case 'set-language': STATE.language = el.dataset.lang; saveState(); render(); break;
    case 'discover-track': {
      if(!STATE.favorites[cid]){
        const p = getProduct(cid);
        STATE.favorites[cid] = { cadenceDays: (p&&p.default_cadence_days)||21, typicalQty:1, addedAt: todayISO() };
      }
      saveState(); render(); break;
    }
    case 'refresh-discover': {
      DISCOVERY_REFRESH_COUNT++;
      DISCOVERY_JUST_REFRESHED = true;
      render(); break;
    }
  }
}
function onChange(e){
  if(e.target.matches('[data-action="move-dealer"]')){
    const cid = e.target.dataset.cid, val = e.target.value;
    if(val){ STATE.basketOverrides[cid] = val; saveState(); render(); }
  }
  if(e.target.matches('[data-action="move-dealer-adhoc"]')){
    const id = e.target.dataset.id, val = e.target.value;
    if(val && STATE.adHocItems[id]){ STATE.adHocItems[id].dealer = val; saveState(); render(); }
  }
  if(e.target.id==='import-file'){
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      try{
        const imported = JSON.parse(ev.target.result);
        STATE = Object.assign(defaultState(), imported);
        saveState(); render();
      }catch(err){ alert(t('importAlertError')); }
    };
    reader.readAsText(file);
  }
}
function addCustomProduct(){
  const name = document.getElementById('custom-name').value.trim();
  const category = document.getElementById('custom-category').value;
  const basis = document.getElementById('custom-basis').value;
  const terms = document.getElementById('custom-terms').value.split(',').map(s=>s.trim()).filter(Boolean);
  if(!name || !terms.length) return;
  const cid = 'custom-'+name.toLowerCase().replace(/[^a-z0-9æøå]+/gi,'-').replace(/(^-|-$)/g,'')+'-'+uid().slice(1,5);
  STATE.customProducts[cid] = { displayName:name, category, compareBasis:basis, matchTerms:terms, excludeTerms:[], cadenceDays:14 };
  STATE.favorites[cid] = { cadenceDays:14, typicalQty:1, addedAt:todayISO() };
  saveState(); render();
}
function exportData(){
  const blob = new Blob([JSON.stringify(STATE,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'tilbudtracker-data-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* =========================================================================
   BOOT
   ========================================================================= */
(async function boot(){
  document.getElementById('app').innerHTML = `<div class="empty-state">${t('loadingWeek')}</div>`;
  bindDelegatedListenersOnce();
  await loadData();
  resetWeekIfNeeded();
  rebuildProductIndex();
  render();
})();
</script>
